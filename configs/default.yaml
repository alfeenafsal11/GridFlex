# GridFlex AI - Default System Configuration

project:
  name: "GridFlex AI"
  version: "0.1.0"
  random_seed: 42

data:
  hf_repo: "OpenSTEF/liander2024-energy-forecasting-benchmark"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  processed_filename: "gridflex_hourly.parquet"
  
  # Benchmark assets selected for representative grid node
  # OS Leiden Noord is selected for purely positive consumption load (no embedded generation distortion)
  load_feeder: "load_measurements/mv_feeder/OS Leiden Noord.parquet"
  solar_park: "load_measurements/solar_park/Within 10 kilometers of Westwoud_normalized.parquet"
  price_file: "EPEX.parquet"
  
  # Temporal resolution
  raw_resolution_min: 15
  model_resolution_hour: 1
  timezone: "UTC"
  
  # Base scenario renewable penetration: Solar total annual energy / Load total annual energy
  base_renewable_penetration: 0.40

forecasting:
  target_horizon_hours: 24
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  lags: [1, 2, 3, 24, 48, 72, 168]
  rolling_windows: [3, 6, 24, 168]
  lightgbm_params:
    objective: "regression"
    metric: "rmse"
    boosting_type: "gbdt"
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 31
    random_state: 42
    n_jobs: -1
    verbose: -1

battery:
  # Prototypical battery storage node parameters (scaled to feeder load)
  # Standard duration: 4 hours of mean demand
  capacity_kwh: 5000.0
  max_charge_kw: 1250.0
  max_discharge_kw: 1250.0
  min_soc: 0.10
  max_soc: 0.90
  charge_efficiency: 0.95
  discharge_efficiency: 0.95
  initial_soc: 0.50

optimization:
  horizon_hours: 24
  solver: "highs"
  # Objective function weights: J = alpha*Cost + beta*Peak + gamma*Curtailment + delta*Throughput
  weights:
    alpha: 1.0     # Electricity cost weight (EUR)
    beta: 0.5      # Peak grid demand penalty weight (EUR/kW)
    gamma: 2.0     # Renewable curtailment penalty weight (EUR/kWh)
    delta: 0.01    # Battery wear / throughput penalty weight (EUR/kWh)
